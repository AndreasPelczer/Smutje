version: "3.8"

services:
  smutje:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: smutje
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/server/data/smutje.db
    volumes:
      - smutje-data:/app/server/data

volumes:
  smutje-data:
